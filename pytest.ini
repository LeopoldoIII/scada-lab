[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    ui: Browser-based UI automation tests
    playwright: Playwright engine tests
    selenium: Selenium WebDriver tests
    api: REST API and contract tests
    modbus: Modbus TCP industrial fieldbus tests
    db: SQL query and database validation tests
    bdd: Behavior-Driven Development Gherkin scenarios
    security: Authentication and RBAC tests
    resilience: Network latency and chaos fault injection tests
    auth: Authentication scenarios
    grid_safety: Grid isolation scenarios

addopts = -ra -q --strict-markers
